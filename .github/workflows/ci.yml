name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  ACR_LOGIN_SERVER: acraiacademy26.azurecr.io
  DEPLOY_BACKEND: ${{ vars.DEPLOY_BACKEND || 'false' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build Docker image
        env:
          IMAGE_TAG: git-happens-backend:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save git-happens-backend:${{ github.sha }} | gzip > git-happens-backend.tar.gz

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: git-happens-backend-image
          path: git-happens-backend.tar.gz

  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: git-happens-backend-image

      - name: Load Docker image
        run: gunzip -c git-happens-backend.tar.gz | docker load

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Push Docker image
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/git-happens-backend
          LOCAL_IMAGE: git-happens-backend:${{ github.sha }}
          SHA_TAG: ${{ env.ACR_LOGIN_SERVER }}/git-happens-backend:${{ github.sha }}
        run: |
          docker tag "$LOCAL_IMAGE" "$SHA_TAG"
          docker push "$SHA_TAG"
          docker tag "$SHA_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Verify images in Azure Container Registry
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker manifest inspect "$ACR_LOGIN_SERVER/git-happens-backend:$IMAGE_SHA"
          docker manifest inspect "$ACR_LOGIN_SERVER/git-happens-backend:latest"

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_environment: dev
      TF_VAR_deploy_backend: ${{ env.DEPLOY_BACKEND }}
      TF_VAR_backend_image: ${{ env.ACR_LOGIN_SERVER }}/git-happens-backend:${{ github.sha }}
    defaults:
      run:
        working-directory: infastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform remote state
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Validate Terraform
        run: terraform validate
      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color

  terraform-deploy:
    name: Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: push
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-dev
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      TF_VAR_environment: dev
      TF_VAR_deploy_backend: ${{ env.DEPLOY_BACKEND }}
      TF_VAR_backend_image: ${{ env.ACR_LOGIN_SERVER }}/git-happens-backend:${{ github.sha }}
    defaults:
      run:
        working-directory: infastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform remote state
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Validate Terraform
        run: terraform validate
      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply Terraform changes
        run: terraform apply -input=false -auto-approve tfplan
